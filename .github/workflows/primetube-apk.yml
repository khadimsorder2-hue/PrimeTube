name: PrimeTube APK

on:
  workflow_dispatch:
  push:
    branches:
      - primetube
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRIMETUBE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.PRIMETUBE_STORE_PASS || 'primetube2026' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/primetube.keystore"
            echo "Using stable secret keystore"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/primetube.keystore" \
              -storetype PKCS12 -alias primetube -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -dname "CN=PrimeTube, OU=PrimeTube, O=PrimeTube, C=US"
            echo "Generated ephemeral keystore (set PRIMETUBE_* secrets for stable signing)"
          fi

      - name: Zipalign and sign release APK
        env:
          STORE_PASS: ${{ secrets.PRIMETUBE_STORE_PASS || 'primetube2026' }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT"
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "Signing: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/release/aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/primetube.keystore" \
            --ks-key-alias primetube \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out app/build/outputs/apk/release/PrimeTube-v32.1-release.apk \
            app/build/outputs/apk/release/aligned.apk
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/PrimeTube-v32.1-release.apk
          rm -f app/build/outputs/apk/release/aligned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeTube-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeTube-release-signed-apk
          path: app/build/outputs/apk/release/PrimeTube-v32.1-release.apk
