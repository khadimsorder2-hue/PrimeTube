name: Build and release app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Build APK
        env:
          # PrimeTube: tag v32.1-buildNN -> versionName "32.1-buildNN" so the
          # in-app updater can compare with the release tag
          PRIMETUBE_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          export PRIMETUBE_VERSION="${PRIMETUBE_VERSION#v}"
          ./gradlew assembleRelease --no-daemon

      # PrimeTube: sign with the stable repo secrets (same keystore as the
      # "PrimeTube APK" workflow) so tag releases are in-place upgradable
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRIMETUBE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.PRIMETUBE_STORE_PASS || 'primetube2026' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/primetube.keystore"
            echo "Using stable PrimeTube keystore from secrets"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/primetube.keystore" \
              -storetype PKCS12 -alias primetube -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -dname "CN=PrimeTube, OU=PrimeTube, O=PrimeTube, C=US"
            echo "Generated ephemeral keystore (set PRIMETUBE_* secrets for stable signing)"
          fi

      - name: Zipalign and sign APK
        env:
          STORE_PASS: ${{ secrets.PRIMETUBE_STORE_PASS || 'primetube2026' }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT"
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "Signing: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/release/aligned.apk
          # PrimeTube: sign with ALL schemes (v1+v2+v3) - every OEM installer
          # (incl. Xiaomi) accepts the package without signature warnings
          "$BT/apksigner" sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$RUNNER_TEMP/primetube.keystore" \
            --ks-key-alias primetube \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out PrimeTube-v32.1-release.apk \
            app/build/outputs/apk/release/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs PrimeTube-v32.1-release.apk

      - name: Create changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      # Create a summary based on the latest fastlane metadata changelog
      - name: Create changelog summary
        id: changelog-summary
        run: |
            summary_file=$(find fastlane/metadata/android/en-US/changelogs/ | sort -t '/' -k 6n | tail -n 1) # get name of latest changelog file
            summary_quoted=$(cat "$summary_file" | xargs -d '\n' -I {} echo "> {}") # prefix each line with "> "
            summary=$(echo -e "> [!NOTE]\n> ## Release Highlights\n$summary_quoted") # format as GitHub markdown admonitions
            echo "summary<<EOF"$'\n'"$summary"$'\n'EOF >> $GITHUB_OUTPUT # make available as actions output


      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body:
            ${{ steps.changelog-summary.outputs.summary }}

            ${{ steps.changelog.outputs.changes }}
          files: "PrimeTube-v32.1-release.apk"
          fail_on_unmatched_files: true
          make_latest: true
